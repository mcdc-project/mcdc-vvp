  <rect width="960" height="390" fill="#fff"/><text x="480" y="29" text-anchor="middle" font-family="sans-serif" font-size="20">RFNC compound photon-leakage experiment</text>
  <circle cx="125" cy="190" r="90" fill="url(#sample)" stroke="#2e6077" stroke-width="2"/><circle cx="125" cy="190" r="45" fill="#fff" stroke="#806b3c" stroke-width="4"/><circle cx="125" cy="190" r="5" fill="#e05252"/><text x="125" y="72" text-anchor="middle" font-family="sans-serif" font-size="14">sample shell: 5–10 cm radius</text><text x="125" y="194" text-anchor="middle" font-family="sans-serif" font-size="11">D–T</text>
  <rect x="215" y="183" width="40" height="14" fill="#737a80" stroke="#333"/><text x="235" y="219" text-anchor="middle" font-family="sans-serif" font-size="12">steel delay rod</text>
  <line x1="260" y1="190" x2="780" y2="190" stroke="#555" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="520" y="178" text-anchor="middle" font-family="sans-serif" font-size="13">photon flight path — detector center at 8.5 m</text>
  <rect x="450" y="90" width="150" height="200" fill="#d8d8d8" stroke="#777" stroke-width="2" stroke-dasharray="6 5"/><rect x="450" y="170" width="150" height="40" fill="#fff"/><text x="525" y="75" text-anchor="middle" font-family="sans-serif" font-size="13">concrete wall and collimator</text>
